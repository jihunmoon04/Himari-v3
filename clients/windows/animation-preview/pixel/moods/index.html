<!doctype html>
<html lang="ko">
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>히마리 도트 표정 시안</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#edf0f7;color:#29344a;font:15px 'Segoe UI',sans-serif}main{max-width:1200px;margin:auto;padding:28px}h1{font-size:24px}p{line-height:1.6}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:16px}.card{border-radius:16px;background:white;overflow:hidden}.stage{height:300px;background:linear-gradient(145deg,#dce5f4,#f9f6fc);display:flex;align-items:end;justify-content:center}.stage img{height:var(--height,250px);max-width:100%;object-fit:contain;image-rendering:pixelated}.label{padding:12px 16px;font-weight:600}input{vertical-align:middle}small{color:#596780}
</style>
<main><h1>히마리 도트 표정 시안</h1><p>설계 초안의 8가지 표정을 비교합니다. 각 이미지는 개별 생성된 시안으로, 자세와 세부가 완전히 일치하지 않을 수 있습니다.</p>
<label for="height">캐릭터 높이: <output id="value">250</output>px </label><input id="height" type="range" min="160" max="280" step="10" value="250">
<div class="grid" id="grid"></div><p><small>기본 그림은 기존 도트 시안입니다. 각 표정은 얼굴만 바꾸고 나머지를 유지하도록 내장 이미지 생성 도구에 요청했습니다. 실제 픽셀 격자와 애니메이션 프레임은 후속 정리가 필요합니다.</small></p></main>
<script>
const moods=[['neutral','기본'],['happy','기쁨'],['excited','신남'],['sad','슬픔'],['surprised','놀람'],['thinking','생각'],['embarrassed','부끄러움'],['worried','걱정']];
const grid=document.querySelector('#grid');
for(const [name,label] of moods){const card=document.createElement('article');card.className='card';const stage=document.createElement('div');stage.className='stage';const img=document.createElement('img');img.src=name+'.png';img.alt=label+' 표정';stage.append(img);const caption=document.createElement('div');caption.className='label';caption.textContent=label+' · '+name;card.append(stage,caption);grid.append(card)}
document.querySelector('#height').addEventListener('input',e=>{document.documentElement.style.setProperty('--height',e.target.value+'px');document.querySelector('#value').textContent=e.target.value});
</script></html>
