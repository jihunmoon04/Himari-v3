[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "himari"
version = "0.0.0"
description = "HIMARI v3 — contract-based modular agent runtime"
requires-python = ">=3.12"
dependencies = ["httpx>=0.27"]

[project.optional-dependencies]
# The Web interface is an optional install (as in v2): the core runtime and
# its tests never need it. ``dev`` includes it so CI type-checks the server.
web = ["fastapi>=0.143", "starlette>=1.8", "uvicorn>=0.54"]
dev = ["pytest>=8", "mypy>=1.10", "fastapi>=0.143", "starlette>=1.8", "uvicorn>=0.54"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"himari.interfaces.web" = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
addopts = "--import-mode=importlib"

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src:tests"
files = ["src", "tests"]
explicit_package_bases = true
