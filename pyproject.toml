[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "himari"
version = "0.0.0"
description = "HIMARI v3 — contract-based modular agent runtime"
requires-python = ">=3.12"
dependencies = ["httpx>=0.27", "jsonschema>=4.18", "pillow>=12"]  # Pillow: only in the image sandbox (V3-P67)

[project.scripts]
himari = "himari.interfaces.cli.main:main"

[project.optional-dependencies]
# The Web interface is an optional install (as in v2): the core runtime and
# its tests never need it. ``dev`` includes it so CI type-checks the server.
web = ["fastapi>=0.143", "starlette>=1.8", "uvicorn>=0.54"]
dev = ["pytest>=8", "mypy>=1.10", "types-jsonschema", "fastapi>=0.143", "starlette>=1.8", "uvicorn>=0.54"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"himari.interfaces.web" = ["static/*", "static/katex/*", "static/katex/fonts/*", "static/codemirror/*",
                          "static/pdfjs/*", "static/pdfjs/wasm/*", "static/pdfjs/cmaps/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
addopts = "--import-mode=importlib"

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src:tests"
files = ["src", "tests"]
explicit_package_bases = true

[[tool.mypy.overrides]]
# The documents worker imports the documents toolkit, which lives outside HIMARI's environment (V3-P70 §6).
module = ["pypdfium2", "pypdfium2.*", "docx", "docx.*", "lxml", "lxml.*", "pptx", "pptx.*", "openpyxl",
          "openpyxl.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# tests/fixtures/pdf/make.py makes committed fixtures with pikepdf, which HIMARI does not depend on.
module = ["pikepdf", "pikepdf.*"]
ignore_missing_imports = true
