# Static and focused UI state checks. Pytest follows docs/testing-policy.md (V3-038):
# module suites by default, the full suite only for public contract changes.
name: static-checks

on:
  push:
  pull_request:

jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: UI async regressions
        run: node scripts/ui_state_smoke.mjs
      - name: Assistant text formulas
        run: node scripts/rich_text_smoke.mjs
      - name: Answer being written
        run: node scripts/live_smoke.mjs
      - name: File explorer pane
        run: node scripts/files_smoke.mjs
      - name: PDF view settings and HIMARI's PDF writing (V3-P77)
        run: node scripts/pdf_smoke.mjs
      - name: Install dev tools
        run: pip install -e ".[dev]"
      - name: Import boundaries (V3-046)
        run: python -I scripts/check_imports.py
      - name: mypy --strict
        run: python -m mypy
